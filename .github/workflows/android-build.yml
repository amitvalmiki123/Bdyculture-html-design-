name: Build Android launcher
on:
  push:
    branches: ["arena/1580de29-bdyculture-html-design"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: ios-launcher
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ios-style-launcher-debug-apk
          path: ios-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
