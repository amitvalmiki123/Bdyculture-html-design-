name: Build Android launcher
on:
  push:
    branches: ["arena/1580de29-bdyculture-html-design"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's Ubuntu runner images include Android SDK platform 35 and build tools.
      # Reuse the installed SDK to avoid downloading Android command-line tools at runtime.
      - name: Locate preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/build-tools/35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: ios-launcher
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon assembleDebug > build-output.log 2>&1
          result=$?
          tail -n 80 build-output.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$result" -ne 0 ]; then
            tail -n 80 build-output.log
            diagnostic=$(tail -n 35 build-output.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Gradle build output::$diagnostic"
            exit "$result"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios-style-launcher-debug-apk
          path: ios-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Package source and publish downloadable build
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr ios-style-launcher-source.zip ios-launcher -x '*/build/*' '*/.gradle/*'
          tag="ios-launcher-build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            ios-launcher/app/build/outputs/apk/debug/app-debug.apk \
            ios-style-launcher-source.zip \
            --title "iOS Style Launcher build ${GITHUB_RUN_NUMBER}" \
            --notes "Install the APK on your Android phone, then press Home and select iOS Style Launcher. Includes the Kotlin source ZIP."
